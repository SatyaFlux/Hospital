<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="swirlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Clean Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#e0f2fe" stroke-width="2" />

  <!-- Circular Crescent Swirl Ring -->
  <path
    d="M 50 14
       A 36 36 0 1 0 84 58
       A 30 30 0 0 1 50 20
       Z"
    fill="url(#swirlGrad)"
    filter="url(#shadow)"
  />

  <!-- Top Accent Crescent Tip -->
  <path
    d="M 52 14
       C 68 15 82 28 85 46
       C 81 33 70 21 54 18
       Z"
    fill="#0284c7"
  />

  <!-- Letter S -->
  <text
    x="34"
    y="62"
    font-family="'Plus Jakarta Sans', Arial, sans-serif"
    font-size="34"
    font-weight="900"
    fill="url(#sGrad)"
    text-anchor="middle"
    letter-spacing="-1"
  >S</text>

  <!-- Letter H -->
  <text
    x="63"
    y="62"
    font-family="'Plus Jakarta Sans', Arial, sans-serif"
    font-size="34"
    font-weight="900"
    fill="url(#hGrad)"
    text-anchor="middle"
    letter-spacing="-1"
  >H</text>

  <!-- Subtle Medical Cross Accent Dot -->
  <circle cx="50" cy="74" r="2.5" fill="#0ea5e9" />
</svg>